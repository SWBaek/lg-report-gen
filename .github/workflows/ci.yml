name: Candidate checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: candidate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  candidate-checks:
    name: candidate-checks
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run candidate checks
        run: npm run check

      - name: Verify Electron fuse policy
        run: npm run verify:electron-fuses
