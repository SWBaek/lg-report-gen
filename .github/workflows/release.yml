name: Release Windows

on:
  push:
    tags:
      - 'v*'

permissions:
  attestations: write
  contents: write
  id-token: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-release:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Checkout tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '24'
          cache: npm

      - name: Verify tag matches package version
        shell: pwsh
        run: |
          $version = node -p "require('./package.json').version"
          if ($env:GITHUB_REF_NAME -ne "v$version") {
            throw "Tag $env:GITHUB_REF_NAME does not match package version $version."
          }

      - name: Install dependencies
        run: npm ci

      - name: Enforce release signing policy
        env:
          RELEASE_SIGNING_REQUIRED: ${{ vars.RELEASE_SIGNING_REQUIRED || 'true' }}
          CSC_LINK: ${{ secrets.WINDOWS_CERTIFICATE_BASE64 }}
          CSC_KEY_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: npm run check:release-signing

      - name: Run source checks
        run: npm run check

      - name: Run Electron workflow tests
        run: npm run test:e2e

      - name: Build Windows packages
        run: npm run build:win
        env:
          RELEASE_SIGNING_REQUIRED: ${{ vars.RELEASE_SIGNING_REQUIRED || 'true' }}
          CSC_LINK: ${{ secrets.WINDOWS_CERTIFICATE_BASE64 }}
          CSC_KEY_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}

      - name: Test packaged application
        shell: pwsh
        run: |
          $env:PACKAGED_APP_PATH = (Get-Content -LiteralPath 'artifacts/latest-packaged-path.txt' -Raw).Trim()
          npm run test:e2e:packaged

      - name: Verify release signatures
        env:
          RELEASE_SIGNING_REQUIRED: ${{ vars.RELEASE_SIGNING_REQUIRED || 'true' }}
        run: npm run verify:release-signatures

      - name: Generate SBOM and production license bundle
        run: npm run release:metadata

      - name: Create SHA-256 checksums
        run: npm run release:checksums

      - name: Verify release checksums
        run: npm run release:verify

      - name: Attest release provenance
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        with:
          subject-path: |
            release/*.exe
            release/SHA256SUMS.txt
            artifacts/sbom/*.json
            artifacts/licenses/THIRD_PARTY_NOTICES.md

      - name: Publish GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SIGNING_REQUIRED: ${{ vars.RELEASE_SIGNING_REQUIRED || 'true' }}
        run: |
          $tag = $env:GITHUB_REF_NAME
          $assets = @(Get-ChildItem -LiteralPath release -Filter '*.exe' | ForEach-Object FullName)
          $assets += (Resolve-Path 'release/SHA256SUMS.txt').Path
          $assets += @(Get-ChildItem -LiteralPath artifacts/sbom -Filter '*.json' | ForEach-Object FullName)
          $assets += (Resolve-Path 'artifacts/licenses/THIRD_PARTY_NOTICES.md').Path
          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) { throw "Release $tag already exists; releases are immutable." }
          $notes = @"
          Windows 10/11 x64용 LG Report Agent입니다.

          - 일반 사용자는 Setup EXE를 권장합니다.
          - Portable EXE는 설치 없이 실행할 수 있습니다.
          - Codex CLI는 별도로 설치하고 로그인해야 합니다.
          - 현재 빌드는 코드 서명되지 않아 Windows SmartScreen 경고가 표시될 수 있습니다.
          - 공식 LG 템플릿·로고·CI 자산은 포함하지 않습니다.
          "@
          if ($env:RELEASE_SIGNING_REQUIRED -eq 'true') {
            $notes = $notes.Replace('현재 빌드는 코드 서명되지 않아 Windows SmartScreen 경고가 표시될 수 있습니다.', 'Windows Authenticode 서명이 적용된 빌드입니다.')
          }
          gh release create $tag @assets --verify-tag --title "LG Report Agent $tag" --generate-notes --notes $notes
